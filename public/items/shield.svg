<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- Minecraft Shield Outline & Rim -->
  <!-- Top Rim -->
  <rect x="5" y="1" width="6" height="1" fill="#dcdcdc"/>
  <rect x="4" y="2" width="8" height="1" fill="#b0b0b0"/>
  
  <!-- Left & Right Iron Rim -->
  <rect x="4" y="3" width="1" height="9" fill="#c0c0c0"/>
  <rect x="11" y="3" width="1" height="9" fill="#4a4a4a"/>
  
  <!-- Bottom Tapered Rim -->
  <rect x="5" y="12" width="6" height="1" fill="#707070"/>
  <rect x="6" y="13" width="4" height="1" fill="#505050"/>
  <rect x="7" y="14" width="2" height="1" fill="#303030"/>

  <!-- Wood Body (Vertical Planks) -->
  <!-- Left Plank -->
  <rect x="5" y="3" width="2" height="9" fill="#8d653a"/>
  <rect x="5" y="5" width="2" height="1" fill="#78532c"/>
  <rect x="5" y="9" width="2" height="1" fill="#78532c"/>
  
  <!-- Center Plank -->
  <rect x="7" y="3" width="2" height="10" fill="#7a552f"/>
  <rect x="7" y="4" width="2" height="1" fill="#664424"/>
  <rect x="7" y="10" width="2" height="1" fill="#664424"/>
  
  <!-- Right Plank -->
  <rect x="9" y="3" width="2" height="9" fill="#6a4927"/>
  <rect x="9" y="6" width="2" height="1" fill="#593b1d"/>
  <rect x="9" y="8" width="2" height="1" fill="#593b1d"/>

  <!-- Center Iron Boss -->
  <rect x="7" y="6" width="2" height="2" fill="#d0d0d0"/>
  <rect x="8" y="7" width="1" height="1" fill="#707070"/>
  <rect x="7" y="6" width="1" height="1" fill="#ffffff"/>

  <!-- Iron Corner Rivets -->
  <rect x="5" y="3" width="1" height="1" fill="#f0f0f0"/>
  <rect x="10" y="3" width="1" height="1" fill="#909090"/>
  <rect x="5" y="11" width="1" height="1" fill="#b0b0b0"/>
  <rect x="10" y="11" width="1" height="1" fill="#606060"/>

  <!-- Rim Highlights & Shadows -->
  <rect x="4" y="2" width="1" height="1" fill="#ffffff"/>
  <rect x="11" y="2" width="1" height="1" fill="#808080"/>
  <rect x="5" y="1" width="1" height="1" fill="#ffffff"/>
  <rect x="10" y="1" width="1" height="1" fill="#a0a0a0"/>
</svg>
